name: Instagram to Telegram Sync

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

concurrency:
  group: instagram-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed to commit state.json back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sync Agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          INSTAGRAM_SESSION_ID: ${{ secrets.INSTAGRAM_SESSION_ID }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          INCLUDE_ORIGINAL_LINK: ${{ secrets.INCLUDE_ORIGINAL_LINK || 'true' }}
          MAX_POSTS_PER_CHECK: 5
        run: |
          python bot.py --single-run

      - name: Commit & push updated state.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f state.json ]; then
            git add state.json
            if ! git diff-index --quiet HEAD; then
              git commit -m "chore: update state.json [skip ci]"
              git pull --rebase origin main || git pull --rebase origin master || true
              git push
            else
              echo "No new state changes."
            fi
          fi
